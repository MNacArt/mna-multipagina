# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
# Panel de administración del sitio del Movimiento Nacional Artiguista (Sveltia CMS).
# Los cambios se guardan como archivos en el repositorio de GitHub y el sitio se actualiza solo.

backend:
  name: github
  repo: avvedit-creator/mna-multipagina
  branch: master
  # Cuando exista el servicio de acceso en Cloudflare (ver instrucciones), descomentar y poner su URL:
  # base_url: https://sveltia-cms-auth.TU-SUBDOMINIO.workers.dev

site_url: https://avvedit-creator.github.io/mna-multipagina/
display_url: https://avvedit-creator.github.io/mna-multipagina/
logo:
  src: https://avvedit-creator.github.io/mna-multipagina/assets/img/logo-sin-fondo.webp

media_folder: /assets/uploads
public_folder: /assets/uploads

media_libraries:
  default:
    config:
      max_file_size: 104857600
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2048
          height: 2048

collections:
  - name: publicaciones
    label: "Publicaciones"
    files:
      - name: noticias
        label: "Noticias (carrusel de Últimas publicaciones)"
        file: content/noticias.json
        fields:
          - label: "Publicaciones"
            label_singular: "publicación"
            name: items
            widget: list
            summary: "{{fields.fecha}} — {{fields.titulo}}"
            hint: "Se muestran las 3 más recientes."
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Fecha", name: fecha, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
              - { label: "Texto", name: texto, widget: text, required: false }
              - { label: "Imagen", name: imagen, widget: image, required: false }
              - { label: "Enlace de YouTube (para incrustar el video)", name: youtube, widget: string, required: false, hint: "Pega el enlace completo. Para videos largos es la mejor opción." }
              - { label: "Video (archivo descargable)", name: video, widget: file, required: false, hint: "Máximo 100 MB. Si es más grande, súbelo a YouTube y usa el enlace." }
              - { label: "PDF", name: pdf, widget: file, required: false }
      - name: propuestas_novedades
        label: "Novedades (página de Propuestas)"
        file: content/propuestas-novedades.json
        fields:
          - label: "Novedades"
            label_singular: "novedad"
            name: items
            widget: list
            summary: "{{fields.fecha}} — {{fields.titulo}}"
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Fecha", name: fecha, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
              - { label: "Texto", name: texto, widget: text, required: false }
              - { label: "Imagen", name: imagen, widget: image, required: false }
              - { label: "Enlace de YouTube (para incrustar el video)", name: youtube, widget: string, required: false, hint: "Pega el enlace completo. Para videos largos es la mejor opción." }
              - { label: "Video (archivo descargable)", name: video, widget: file, required: false, hint: "Máximo 100 MB. Si es más grande, súbelo a YouTube y usa el enlace." }
              - { label: "PDF", name: pdf, widget: file, required: false }
      - name: ensayos
        label: "Ensayos de interés"
        file: content/ensayos.json
        fields:
          - label: "Ensayos"
            label_singular: "ensayo"
            name: items
            widget: list
            summary: "{{fields.fecha}} — {{fields.titulo}}"
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Autor", name: autor, widget: string, required: false }
              - { label: "Fecha de publicación", name: fecha, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true, required: false }
              - { label: "Enlace al ensayo", name: url, widget: string, hint: "Debe empezar con https://" }
      - name: video
        label: "Video de interés (Noticias)"
        file: content/video.json
        fields:
          - { label: "Enlace de YouTube", name: url, widget: string, required: false, hint: "Cualquier enlace de YouTube (normal, en vivo, corto o youtu.be). Déjalo vacío para quitar la sección de la página." }

  - name: textos
    label: "Textos e imágenes de las páginas"
